# XcodeGen spec for the iOS app (CI runs `xcodegen generate`; the .xcodeproj is not committed).
name: Belfry
options:
  bundleIdPrefix: sh.belfry
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  BelfryCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Belfry:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: BelfryCore
        product: BelfryCore
      - target: NotificationService
        embed: true
    entitlements:
      path: App/Belfry.entitlements
      properties:
        # push (docs/push.md): APNs, the App Group and the keychain group shared with the extension
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.security.application-groups: [group.sh.belfry.app]
        keychain-access-groups: [$(AppIdentifierPrefix)sh.belfry.app.shared]
        # guest links https://chat.<domain>/join/<token> and event addresses /events/<link> open
        # in the app once each chat host serves apple-app-site-association (SERVER-NEEDS.md 5)
        com.apple.developer.associated-domains:
          - applinks:chat.belfry.sh
          - applinks:chat.enspiral.eu
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Belfry
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: sh.belfry.app.connect
            CFBundleURLSchemes: [sh.belfry.app]
        NSPhotoLibraryUsageDescription: Choose photos to send in a channel.
        BelfryKeychainGroup: $(AppIdentifierPrefix)sh.belfry.app.shared
        UIBackgroundModes: [remote-notification]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.belfry.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(BELFRY_TEAM_ID)
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
  NotificationService:
    # decrypts a push's payload `b` with the device key K (NIP-44 v2) and sets title and body
    type: app-extension
    platform: iOS
    sources:
      - path: App/NotificationService
    dependencies:
      - package: BelfryCore
        product: BelfryCore
    entitlements:
      path: App/NotificationService.entitlements
      properties:
        com.apple.security.application-groups: [group.sh.belfry.app]
        keychain-access-groups: [$(AppIdentifierPrefix)sh.belfry.app.shared]
    info:
      path: App/NotificationService-Info.plist
      properties:
        CFBundleDisplayName: Belfry notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        BelfryKeychainGroup: $(AppIdentifierPrefix)sh.belfry.app.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.belfry.app.notifications
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(BELFRY_TEAM_ID)
schemes:
  Belfry:
    build:
      targets:
        Belfry: all
    run:
      config: Debug
    archive:
      config: Release
