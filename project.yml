# XcodeGen spec for the iOS app (CI runs `xcodegen generate`; the .xcodeproj is not committed).
name: Belfry
options:
  bundleIdPrefix: sh.belfry
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  BelfryCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Belfry:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: BelfryCore
        product: BelfryCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Belfry
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: sh.belfry.app.connect
            CFBundleURLSchemes: [sh.belfry.app]
        NSPhotoLibraryUsageDescription: Choose photos to send in a channel.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.belfry.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(BELFRY_TEAM_ID)
schemes:
  Belfry:
    build:
      targets:
        Belfry: all
    run:
      config: Debug
    archive:
      config: Release
